<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla OAuth callback</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem}
code{display:block;background:#f4f4f4;padding:1rem;word-break:break-all;border-radius:8px}
button{margin-top:1rem;padding:.6rem 1.2rem;font-size:1rem}
</style>
</head>
<body>
<h1>Authorized</h1>
<p>Copy this code and paste it back into the chat:</p>
<code id="code">waiting…</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy</button>
<script>
const p = new URLSearchParams(location.search);
const c = p.get('code');
document.getElementById('code').textContent = c || ('no code found — ' + (p.get('error') || 'unknown error'));
</script>
</body>
</html>
